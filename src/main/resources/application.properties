# Application properties for the Taskflow API Spring Boot application
spring.application.name=taskflow-api

# Database configuration
# Using H2 in-memory database for development and testing
spring.datasource.url=jdbc:h2:mem:taskflowdb
# Using H2 database driver
spring.datasource.driverClassName=org.h2.Driver
# Using default username and password for H2 database
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration
# Hibernate DDL auto configuration to update the database schema on application startup
spring.jpa.hibernate.ddl-auto=update
# Show SQL statements in the console for debugging purposes
spring.jpa.show-sql=true
# Specify the Hibernate dialect for H2 database
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Defer database initialization until Hibernate generates tables
spring.jpa.defer-datasource-initialization=true

# SQL initialization configuration
# Always initialize the database with the SQL scripts on application startup
spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.sql.init.data-locations=classpath:initialTasks.sql

# H2 Console
spring.h2.console.enabled=true
